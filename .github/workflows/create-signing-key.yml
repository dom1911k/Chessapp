name: Create signing key (one-time)

# Creates the Android signing keystore for you, so you don't need to install
# anything. Run it ONCE, after adding the ANDROID_KEYSTORE_PASSWORD secret.
# It refuses to run if ANDROID_KEYSTORE_BASE64 already exists, so you can't
# accidentally replace your key (that would break updates).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Generate keystore
        env:
          EXISTING: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$EXISTING" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 already exists. You already have a signing key — keep using it. (Delete that secret first only if you really want a brand-new key; then existing installs can't be updated.)"
            exit 1
          fi
          if [ ${#PASSWORD} -lt 12 ]; then
            echo "::error::Add a secret named ANDROID_KEYSTORE_PASSWORD with at least 12 characters first (see README)."
            exit 1
          fi
          mkdir out
          keytool -genkeypair -noprompt \
            -keystore out/chess-coach-release.keystore -storetype PKCS12 \
            -alias chesscoach -keyalg RSA -keysize 4096 -validity 36500 \
            -storepass "$PASSWORD" -keypass "$PASSWORD" \
            -dname "CN=Chess Coach, O=Personal"
          base64 -w 0 out/chess-coach-release.keystore > out/keystore-base64.txt
          cat > out/READ-ME-FIRST.txt <<'TXT'
          1. Open keystore-base64.txt, select everything, copy it.
          2. In GitHub: Settings > Secrets and variables > Actions > New repository secret
             Name: ANDROID_KEYSTORE_BASE64   Value: (paste)
          3. Keep chess-coach-release.keystore AND your password somewhere safe
             (e.g. a password manager). Without them you can never update the app.
          4. Delete this artifact from the workflow run page.
          TXT
          keytool -list -keystore out/chess-coach-release.keystore -storepass "$PASSWORD" | grep -i fingerprint || true

      - name: Upload keystore (password protected, deleted after 1 day)
        uses: actions/upload-artifact@v4
        with:
          name: chess-coach-signing-key
          path: out/
          retention-days: 1
