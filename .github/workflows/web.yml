name: Web app

# Publishes the web version (for iPhone: Safari → Share → Add to Home Screen) to
# GitHub Pages. Runs automatically after every successful Android release, so both
# get the same version, or manually from the Actions tab.
# One-time setup: Settings → Pages → Source: "GitHub Actions" (see README).
on:
  workflow_run:
    workflows: ['Android release']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Work out version number
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || true)
          VERSION="${TAG#v}"
          [ -n "$VERSION" ] || VERSION="web-$(git rev-parse --short HEAD)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing web version $VERSION"

      - name: Build the web app
        env:
          VITE_PWA: '1'
          VITE_APP_VERSION: ${{ steps.version.outputs.version }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
